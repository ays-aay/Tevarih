<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tevârih</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Georgia, serif; background: #f5f0e8; color: #2c1810; min-height: 100vh; }
    header { background: linear-gradient(rgba(80,20,0,0.6), rgba(80,20,0,0.6)), url('Barbarossa_fleet_wintering_in_Toulon_1543.jpg') center/cover no-repeat; padding: 6rem 2rem 4rem; text-align: center; }
    header h1 { color: #fff; font-size: 3.2rem; font-weight: normal; letter-spacing: 3px; margin-bottom: 0.75rem; }
    header .tagline { color: rgba(255,255,255,0.85); font-size: 1rem; margin-bottom: 2rem; }
    header .subtitle { color: rgba(255,255,255,0.75); font-size: 0.95rem; max-width: 650px; margin: 0 auto; line-height: 1.8; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; max-width: 900px; margin: 3rem auto 4rem; padding: 0 2rem; }
    .card { background: #fff; border: 1px solid #d4c5a9; border-radius: 4px; overflow: hidden; text-decoration: none; color: inherit; display: block; transition: box-shadow 0.2s; }
    .card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    .card-header { background: #7a1414; padding: 1.5rem; }
    .card-header h2 { color: #fff; font-size: 1.4rem; font-weight: normal; }
    .card-header span { color: rgba(255,255,255,0.7); font-size: 0.85rem; font-family: sans-serif; }
    .card-body { padding: 1.5rem; }
    .card-body p { font-size: 0.9rem; line-height: 1.7; color: #444; margin-bottom: 1rem; }
    .badge { display: inline-block; background: #f5f0e8; border: 1px solid #d4c5a9; padding: 4px 12px; border-radius: 2px; font-size: 0.8rem; font-family: sans-serif; color: #666; margin-right: 6px; margin-bottom: 6px; }
    .card-footer { padding: 1rem 1.5rem; border-top: 1px solid #f0e8d8; text-align: right; font-family: sans-serif; font-size: 0.85rem; color: #7a1414; }
    footer { text-align: center; padding: 2.5rem 2rem; border-top: 1px solid #d4c5a9; background: #fff; }
    footer a { display: inline-block; }
    footer img { height: 120px; width: auto; }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } header { padding: 4rem 1.5rem 3rem; } }
  </style>
</head>
<body>
<header>
  <h1>Tevârih</h1>
  <p class="tagline">Osmanlı Tarih Yazıcılığına Dijital Bir Yaklaşım</p>
  <p class="subtitle">Tevârih, Osmanlı tarih yazıcılığına ilişkin iki farklı kaynağı temel alan dijital katalog çalışmalarını bir araya getiren bir platformdur. Aşağıdan incelemek istediğiniz koleksiyonu seçiniz.</p>
</header>
